/* ===== views ===== */
const ART={rec:`<svg viewBox="0 0 120 80" aria-hidden="true"><circle cx="94" cy="20" r="11" fill="#ffd36b"/><path d="M0 80V50l28-30 22 24 18-14 52 36V80z" fill="#0b464c"/><path d="M0 80V62l30-20 24 18 24-12 42 32V80z" fill="#3aa095"/><path d="M-5 74c30-8 45 6 70 0s40-6 60 2V80H-5z" fill="#a9e0ec"/></svg>`,
fam:`<svg viewBox="0 0 120 80" aria-hidden="true"><circle cx="38" cy="30" r="14" fill="#f3c9a4"/><path d="M12 80c2-22 12-28 26-28s24 6 26 28z" fill="#a14b13"/><circle cx="80" cy="38" r="11" fill="#e0b08a"/><path d="M60 80c2-17 9-22 20-22s18 5 20 22z" fill="#0f5c63"/><circle cx="104" cy="54" r="8" fill="#f3c9a4"/><path d="M92 80c1-12 5-16 12-16s11 4 12 16z" fill="#5b2a86"/></svg>`,
ev:`<svg viewBox="0 0 120 80" aria-hidden="true"><path d="M12 42H108" stroke="#fff" stroke-width="4" stroke-linecap="round"/><g fill="#ffd36b"><circle cx="20" cy="42" r="8"/><circle cx="50" cy="42" r="8"/><circle cx="80" cy="42" r="8"/><circle cx="104" cy="42" r="8"/></g><g fill="#fff" opacity=".85"><rect x="12" y="14" width="16" height="12" rx="3"/><rect x="42" y="58" width="16" height="12" rx="3"/><rect x="72" y="14" width="16" height="12" rx="3"/></g></svg>`};
const ring=p=>{const c=2*Math.PI*36;return `<svg width="104" height="104" viewBox="0 0 90 90" role="img" aria-label="${Math.round(p*100)}%"><circle cx="45" cy="45" r="36" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="9"/><circle cx="45" cy="45" r="36" fill="none" stroke="#ffd36b" stroke-width="9" stroke-linecap="round" stroke-dasharray="${c*p} ${c}" transform="rotate(-90 45 45)"/><text x="45" y="52" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">${Math.round(p*100)}%</text></svg>`};
function tasks(){return S.tasks.slice().sort((a,b)=>a.t.localeCompare(b.t)).map(x=>{const s=stt(x);return `<div class="task ${x.d?"d":""}"><input type="checkbox" aria-label="${t("done")}" ${x.d?"checked":""} data-tog="${x.id}"><time>${x.t}</time><span class="tx">${lab(x)}</span><span class="pill ${s=="done"?"ok":s=="missed"?"bad":""}">${t(s)}</span></div>`}).join("")}
const tile=(k,d)=>`<button class="tile ${k}" data-play="${k}"><span class="art">${ART[k]}</span><span class="tt"><b>${t(d[0])}</b><small>${t(d[1])}</small></span><span class="stars" aria-label="${t("level")} ${S.lvl[k]}">${"★".repeat(S.lvl[k])}${"☆".repeat(3-S.lvl[k])}</span></button>`;
function elder(){const n=S.tasks.length,d=S.tasks.filter(x=>x.d).length,h=new Date().getHours(),nx=S.tasks.filter(x=>!x.d&&x.t>=hm()).sort((a,b)=>a.t.localeCompare(b.t))[0];
return `<div class="grid"><section class="card hero span"><div><div class="kick">${t(h<12?"gm":h<17?"ga":"ge")} · ${new Date().toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"})}</div><h2>${t("welcome")}, ${esc(cp().name)}</h2><div class="nx"><small>${t("next")}</small><b>${nx?nx.t+" · "+lab(nx):t("none")}</b></div></div><div style="text-align:center">${ring(n?d/n:0)}<div class="kick">${t("prog")}</div></div></section>
<section class="card span"><h2>${t("games")}</h2><div class="tiles">${tile("rec",["g_rec","g_rec_d"])}${tile("fam",["g_fam","g_fam_d"])}${tile("ev",["g_ev","g_ev_d"])}</div></section>
<section class="card"><h2>${t("routines")}</h2>${tasks()}<form id="aF" class="row" style="margin-top:14px"><input id="aX" required placeholder="${t("what")}" aria-label="${t("what")}" style="flex:1;min-width:150px"><input id="aT" type="time" required value="${hm()}" aria-label="time"><button>${t("add")}</button></form></section>
<section class="card"><h2>💧 ${t("water")}</h2><div class="glasses">${Array.from({length:8},(_,i)=>`<span class="gl ${i<S.water?"f":""}"></span>`).join("")}</div><button data-water>${t("glass")} · ${S.water}/8</button></section></div>`}
function chart(){const ser=[["rec","memory","#0f5c63"],["fam","attention","#c98a0a"],["ev","problem","#7a3fb0"]];if(!ser.some(s=>S.hist[s[0]].length))return `<p class="mute">${t("nodata")}</p>`;const y=v=>118-v*1.04;
return `<svg viewBox="0 0 320 140" style="width:100%" role="img" aria-label="${t("trends")}">${[0,50,100].map(v=>`<line x1="34" x2="312" y1="${y(v)}" y2="${y(v)}" stroke="#e6e1d6"/><text x="28" y="${y(v)+4}" text-anchor="end" font-size="10" fill="#4a5b62">${v}</text>`).join("")}`+ser.map(([k,,c])=>{const h=S.hist[k].slice(-7).map(x=>x.a);if(!h.length)return"";const X=i=>h.length>1?40+i*266/(h.length-1):173;return `<polyline fill="none" stroke="${c}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" points="${h.map((v,i)=>X(i)+","+y(v)).join(" ")}"/>`+h.map((v,i)=>`<circle cx="${X(i)}" cy="${y(v)}" r="4" fill="#fff" stroke="${c}" stroke-width="2.5"/>`).join("")}).join("")+`</svg><div class="row lg">${ser.map(([,n,c])=>`<span style="color:${c}">● ${t(n)}</span>`).join("")}</div>`}
function alertsList(p=snap()){const a=[];p.tasks.filter(x=>stt(x)=="missed"&&!p.ackd.includes("m"+x.id)).forEach(x=>a.push(["m"+x.id,`${t("ma")}: ${lab(x)} (${x.t})`]));
["rec","fam","ev"].forEach(k=>{const h=p.hist[k].map(x=>x.a);if(h.length>=3){const l=h[h.length-1],av=h.slice(0,-1).reduce((s,x)=>s+x,0)/(h.length-1);const id="d"+k+h.length;if(l<av-30&&!p.ackd.includes(id))a.push([id,`${t("drop")}: ${t({rec:"g_rec",fam:"g_fam",ev:"g_ev"}[k])}`])}});
p.sos.forEach(s=>{if(!p.ackd.includes("s"+s))a.push(["s"+s,"SOS · "+new Date(s).toLocaleTimeString()])});return a}
function patList(q=""){snap();q=q.toLowerCase();const ids=Object.keys(S.pts),rows=ids.filter(id=>(S.pts[id].name+" "+id).toLowerCase().includes(q));
 return rows.length?rows.map(id=>{const p=S.pts[id],c={done:0,missed:0,pending:0};p.tasks.forEach(x=>c[stt(x)]++);const al=alertsList(p).length,lg=lastGame(p);
 return `<button class="pc ${id==S.cur?"sel":""}" data-sel="${id}" aria-pressed="${id==S.cur}">${face({n:p.name},ids.indexOf(id))}<span class="pi"><b>${esc(p.name)}</b><small>ID ${id}</small><span class="mini"><em class="ok">✔ ${c.done}</em><em class="bad">✖ ${c.missed}</em><em>⏳ ${c.pending}</em>${lg!=null?`<em>🎮 ${lg}%</em>`:""}</span></span><span class="badge ${al?"bd":"gd"}">${al?"⚠ "+al:"●"}</span></button>`}).join(""):`<p class="mute">${t("nores")}</p>`}
const overview=()=>`<section class="card span"><div class="row" style="justify-content:space-between"><h2 style="margin:0">${t("pts")} (${Object.keys(S.pts).length})</h2><input id="ps" type="search" placeholder="${t("search")}" aria-label="${t("search")}" style="min-width:220px"></div><div class="pcards" id="pl" style="margin-top:14px">${patList()}</div><form id="pF" class="row" style="margin-top:16px"><input id="pN" required placeholder="${t("name")}" aria-label="${t("name")}" style="flex:1;min-width:150px"><button>${t("addp")}</button></form><p class="mute" style="font-size:.8rem;margin:10px 0 0">${t("demo")}</p></section>`;
function care(){const c={done:0,missed:0,pending:0};S.tasks.forEach(x=>c[stt(x)]++);const al=alertsList(),nm={rec:"g_rec",fam:"g_fam",ev:"g_ev"},col={rec:"#0f5c63",fam:"#c98a0a",ev:"#7a3fb0"};
const act=[].concat(...["rec","fam","ev"].map(k=>S.hist[k].map(x=>({k,...x})))).sort((a,b)=>b.ts-a.ts).slice(0,5);
const hmr=(lb,id,v,g,st)=>`<label class="hm"><span>${lb}</span><input type="number" min="0" step="${st}" id="${id}" value="${v}"><div class="bar"><i style="width:${Math.min(100,v/g*100)}%"></i></div><small>/ ${g}</small></label>`;
return `<div class="grid">${overview()}<section class="card span ph"><div class="phrow">${face({n:cp().name},Object.keys(S.pts).indexOf(S.cur))}<div><h2>${esc(cp().name)}</h2><div class="mute">ID ${S.cur}</div></div><span class="badge ${al.length?"bd":"gd"}">${al.length?"⚠ "+t("attn"):"● "+t("stable")}</span></div>
<div class="tiles3"><div class="st ok"><b>${c.done}</b>${t("done")}</div><div class="st bad"><b>${c.missed}</b>${t("missed")}</div><div class="st"><b>${c.pending}</b>${t("pending")}</div></div></section>
<section class="card"><h2>${t("trends")}</h2>${chart()}</section>
<section class="card"><h2>${t("alerts")}</h2>${al.length?al.map(a=>`<div class="alert"><span class="ai">${a[0][0]=="s"?"🚨":a[0][0]=="d"?"📉":"⏰"}</span><span>${esc(a[1])}</span><button class="alt" data-ack="${a[0]}">${t("ack")}</button></div>`).join(""):`<p class="ok"><b>✔ ${t("noalerts")}</b></p>`}
<h3>${t("activity")}</h3>${act.length?act.map(x=>`<div class="act"><i style="background:${col[x.k]}"></i><span>${t(nm[x.k])}</span><b style="margin-left:auto">${x.a}%</b><span class="mute">· ${t("level")} ${x.l}</span></div>`).join(""):`<p class="mute">${t("nodata")}</p>`}</section>
<section class="card"><h2>${t("health")}</h2><div class="hms">${hmr(t("steps"),"hSt",S.steps,5000,100)}${hmr(t("sleep"),"hSl",S.sleep,8,.1)}${hmr(t("waterl"),"hW",S.water,8,1)}</div></section>
<section class="card"><h2>${t("notes")}</h2><textarea id="nt" rows="5" style="width:100%">${esc(S.notes)}</textarea></section>
<section class="card span"><h2>${t("famadd")}</h2><form id="fF" class="row"><input id="fN" required placeholder="${t("name")}" aria-label="${t("name")}" style="flex:1;min-width:140px"><select id="fR" aria-label="${t("rel")}">${["daughter","son","husband","friend"].map(r=>`<option value="${r}">${t(r)}</option>`).join("")}</select><label class="mute">${t("photo")} <input type="file" id="fP" accept="image/*"></label><button>${t("save")}</button></form>
<div class="row" style="margin-top:14px;gap:18px">${S.fam.map((p,i)=>`<div style="text-align:center;width:84px">${face(p,i).replace('class="face"','class="face" style="width:72px;height:72px;margin:0 auto 4px;box-shadow:none"')}<small>${esc(p.n)}</small></div>`).join("")}</div></section></div>`}
/* ===== games with live adaptive difficulty ===== */
let G=null;
function start(k){G={k,i:0,sc:0,win:[],mist:0,sel:[],fb:"",rounds:5,done:false};nq()}
function nq(){const L=S.lvl[G.k];G.sel=[];G.mist=0;G.fb="";G.locked=false;
 if(G.k=="rec"){const q=rnd(QS);G.q={q:q.q,a:q.a,o:shuf([q.a,...shuf(q.w).slice(0,L)])};say(t(q.q))}
 else if(G.k=="fam"){const p=rnd(S.fam);G.q={p,o:shuf([p,...shuf(S.fam.filter(x=>x!==p)).slice(0,L)])};say(t("who"))}
 else{const sub=shuf(S.ev).slice(0,Math.min(S.ev.length,L+2));G.q={show:shuf(sub),ord:sub.slice().sort((a,b)=>a.y-b.y)};say(t("order"))}}
function finish(ok){if(ok)G.sc++;G.win.push(ok);const L=S.lvl[G.k],l3=G.win.slice(-3);let m="";
 if(l3.length==3&&l3.every(x=>x)&&L<3){S.lvl[G.k]++;G.win=[];m=" "+t("lvlup")}else if(l3.filter(x=>!x).length>=2&&L>1){S.lvl[G.k]--;G.win=[];m=" "+t("lvldn")}
 G.fb=(ok?"✅ "+t("right"):"💛 "+t("wrong"))+m;G.locked=true;say(G.fb);
 if(G.i+1>=G.rounds)S.hist[G.k].push({a:Math.round(G.sc/G.rounds*100),l:S.lvl[G.k],ts:Date.now()})}
function gameView(){const k=G.k,L="ABCD";if(G.i>=G.rounds)return `<section class="card gcard"><div style="font-size:3.5rem">${G.sc>=G.rounds*.6?"🌟":"💛"}</div><h2>${t("score")}: ${G.sc}/${G.rounds}</h2><div class="bar"><i style="width:${G.sc/G.rounds*100}%"></i></div><p class="row" style="justify-content:center;margin-top:18px"><button data-play="${k}">${t("again")}</button><button class="alt" data-exit>${t("back")}</button></p></section>`;
 let body="";const q=G.q;
 if(k=="rec")body=`<h2>${t(q.q)}</h2><div class="opts">${q.o.map((o,i)=>`<button data-a="${esc(o)}"><i>${L[i]}</i>${esc(o)}</button>`).join("")}</div>`;
 else if(k=="fam")body=`<h2>${t("who")}</h2>${face(q.p,S.fam.indexOf(q.p))}<div class="opts">${q.o.map((o,i)=>`<button data-a="${esc(o.n)}"><i>${L[i]}</i>${esc(o.n)}</button>`).join("")}</div>`;
 else body=`<h2>${t("order")}</h2><div class="evs">${q.show.map(e=>`<button data-e="${e.k}" class="${G.sel.includes(e.k)?"p":""}"><i>${G.sel.includes(e.k)?G.sel.indexOf(e.k)+1:"•"}</i>${t(e.k)}</button>`).join("")}</div>`;
 return `<section class="card gcard"><div class="gtop"><button class="alt" data-exit>‹ ${t("back")}</button><span class="mute"><b>${t("level")} ${S.lvl[k]}</b> · ${t("score")} ${G.sc}</span></div><div class="dots" aria-label="${t("round")} ${G.i+1}/${G.rounds}">${Array.from({length:G.rounds},(_,i)=>`<i class="${i<G.i?"on":i==G.i?"cur":""}"></i>`).join("")}</div>${body}<p class="fb" role="status">${G.fb}</p>${G.locked?`<button data-nq>${t("nextq")} ›</button>`:""}</section>`}
function ans(v,b){if(G.locked)return;const ok=G.k=="rec"?v==G.q.a:v==G.q.p.n;finish(ok);render();
 document.querySelectorAll("[data-a]").forEach(x=>{if(x.dataset.a==(G.k=="rec"?G.q.a:G.q.p.n))x.classList.add("r");else if(x.dataset.a==v)x.classList.add("w")})}
function evTap(k){if(G.locked||G.sel.includes(k))return;if(G.q.ord[G.sel.length].k==k){G.sel.push(k);if(G.sel.length==G.q.ord.length)finish(G.mist==0);render()}else{G.mist++;G.fb="💛 "+t("wrong");render()}}
/* ===== shell ===== */
function render(){document.documentElement.lang=S.lang;document.title=t("title");$("hT").textContent=t("title");$("hS").textContent=t("sub");$("sos").textContent="🚨 "+t("sos");$("lang").value=S.lang;$("vc").setAttribute("aria-pressed",S.voice);
 $("bNet").textContent=navigator.onLine?t("online"):t("offline");$("bNet").className="chip "+(navigator.onLine?"g":"");$("bBh").textContent=BH?t("bhon"):t("bhoff");$("bBh").className="chip "+(BH?"g":"");
 $("nav").innerHTML=["elder","care"].map(v=>`<button data-v="${v}" ${S.view==v?'aria-current="page"':""}>${v=="elder"?"🏠":"🩺"} ${t(v)}</button>`).join("");
 $("m").innerHTML=S.view=="care"?care():(G?gameView():elder());save()}
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const d=b.dataset;
 if(d.v){S.view=d.v;G=null}else if(d.play)start(d.play);else if(d.exit!==undefined)G=null;else if(d.sel){switchTo(d.sel);G=null}else if(d.nq!==undefined){G.i++;if(G.i<G.rounds)nq()}
 else if(d.a!==undefined)return ans(d.a,b);else if(d.e)return evTap(d.e);else if(d.water!==undefined)S.water++;
 else if(d.ack){S.ackd.push(d.ack)}else if(b.id=="vc"){S.voice=!S.voice;b.setAttribute("aria-pressed",S.voice);if(S.voice)say(t("title"))}else return;render()});
document.addEventListener("change",e=>{const x=e.target;if(x.dataset.tog){S.tasks.find(y=>y.id==x.dataset.tog).d=x.checked?1:0;render()}
 else if(x.id=="lang")setLang(x.value);else if(x.id=="hSt"){S.steps=+x.value;save()}else if(x.id=="hSl"){S.sleep=+x.value;save()}else if(x.id=="hW"){S.water=+x.value;save()}else if(x.id=="nt"){S.notes=x.value;save()}});
document.addEventListener("submit",async e=>{e.preventDefault();
 if(e.target.id=="pF"){addPatient($("pN").value.trim());render()}else if(e.target.id=="aF"){S.tasks.push({id:S.nid++,x:$("aX").value.trim(),t:$("aT").value,d:0});render()}
 else if(e.target.id=="fF"){const p={n:$("fN").value.trim(),r:$("fR").value},f=$("fP").files[0];
  if(f){try{p.img=await new Promise((ok,no)=>{const im=new Image();im.onload=()=>{const c=document.createElement("canvas");c.width=c.height=200;const g=c.getContext("2d"),s=Math.min(im.width,im.height);g.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,200,200);ok(c.toDataURL("image/jpeg",.7))};im.onerror=no;im.src=URL.createObjectURL(f)})}catch(x){}}
  S.fam.push(p);render()}});
$("nav").addEventListener("click",()=>{});
document.addEventListener("input",e=>{if(e.target.id=="ps")$("pl").innerHTML=patList(e.target.value)});
$("sos").onclick=()=>{$("mT").textContent=t("sosq");$("mY").textContent=t("yes");$("mN").textContent=t("no");$("modal").classList.add("on");$("mN").focus()};
$("mN").onclick=()=>$("modal").classList.remove("on");
$("mY").onclick=async()=>{$("modal").classList.remove("on");S.sos.push(Date.now());let m;
 try{const r=await fetch("/api/sos",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({patient:cp().name,message:"pressed SOS"})});const j=await r.json();if(!r.ok)throw 0;m=j.simulated?t("sosdemo"):t("sosok")}catch(e){m=t("sosfail")}
 $("st").textContent="🚨 "+m;say(m);render()};
/* ===== reminders ===== */
const fired=new Set();setInterval(()=>{const n=hm();S.tasks.forEach(x=>{const k=x.id+x.t;if(!x.d&&x.t==n&&!fired.has(k)){fired.add(k);$("mT").textContent=lab(x);$("mY").textContent="✔ "+t("done");$("mN").textContent=t("no");$("modal").classList.add("on");say(lab(x));
 $("mY").onclick=()=>{x.d=1;$("modal").classList.remove("on");$("mY").onclick=sosYes;render()}}});if(!G&&!$("modal").classList.contains("on")&&!document.activeElement.matches("input,select,textarea"))render()},20000);
const sosYes=$("mY").onclick;
/* ===== Bhashini language switching ===== */
$("lang").innerHTML=LANGS.map(l=>`<option value="${l[0]}">${l[1]}</option>`).join("");
async function setLang(l){const st=$("st");st.textContent="";const prev=S.lang;
 if(T[l]||TR[l]){S.lang=l;return render()}
 st.textContent=t("trn");$("lang").disabled=true;
 try{const keys=Object.keys(T.en),r=await fetch("/api/translate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({target:l,texts:keys.map(k=>T.en[k])})});
  const tx=await r.text();let j;try{j=JSON.parse(tx)}catch(x){throw new Error("The page is not being served by server.js (got HTTP "+r.status+" with no data). Run: node --env-file=.env server.js and open http://localhost:3000")}if(!r.ok)throw new Error(j.error||"HTTP "+r.status);
  TR[l]=Object.fromEntries(keys.map((k,i)=>[k,j.translations[i]]));try{localStorage.setItem("mc2tr",JSON.stringify(TR))}catch(e){}S.lang=l;st.textContent=""}
 catch(e){S.lang=prev;st.textContent="⚠ "+t("trf")+": "+e.message+". "+t("stay")}
 $("lang").disabled=false;render()}
fetch("/api/health").then(r=>r.json()).then(j=>{BH=j.bhashini;render()}).catch(()=>{});
addEventListener("online",render);addEventListener("offline",render);
if(S.lang!="en"&&!T[S.lang]&&!TR[S.lang]){const l=S.lang;S.lang="en";setLang(l)}else render();
</script></body></html>
